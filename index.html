<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Knowledge</title>
<meta name="description" content="An interactive graph of AI knowledge — topics, workflows, and articles." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main">
      <div class="topbar">
        <button class="icon-btn" id="nav-toggle" title="Toggle menu">☰</button>
        <span class="breadcrumb" id="breadcrumb">Home</span>
        <span class="spacer"></span>
        <button class="palette-trigger" id="palette-trigger" title="Search">
          Search <kbd>⌘K</kbd>
        </button>
        <button class="icon-btn" id="theme-toggle" title="Toggle theme">☾</button>
      </div>
      <div id="main-content"></div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
